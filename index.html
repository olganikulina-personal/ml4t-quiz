<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML4T T/F Quiz</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #fff; --text: #1d1d1b; --muted: #5f5f5a; --border: #d9d9d4;
    --accent: #0b5cad; --ok: #1b7a3a; --ok-bg: #e8f4ec; --bad: #b3261e; --bad-bg: #fbeaea;
    --warn-bg: #fff4d6; --warn: #7a5300;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 1.375rem; margin: 0 0 0.25rem; }
  h2 { font-size: 1.125rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 0.75rem; }
  .muted { color: var(--muted); font-size: 0.875rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1.25rem; margin-top: 1rem; }
  .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
  button { font: inherit; padding: 0.5rem 1rem; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  fieldset { border: 0; padding: 0; margin: 0 0 1rem; }
  legend { font-weight: 600; margin-bottom: 0.5rem; }
  label.opt { display: inline-flex; align-items: center; gap: 0.375rem; margin-right: 1rem; cursor: pointer; }
  select, input[type=number] { font: inherit; padding: 0.25rem 0.5rem; max-width: 100%; }
  .meta { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: 0.875rem; color: var(--muted); }
  .qid { font-family: ui-monospace, Menlo, monospace; font-weight: 600; color: var(--text); }
  .inverted { background: var(--warn-bg); color: var(--warn); border: 1px solid #e6c766; padding: 0.5rem 0.75rem; border-radius: 4px; margin-bottom: 0.75rem; font-weight: 600; }
  .stmt { border-top: 1px solid var(--border); padding: 0.75rem 0; }
  .stmt-text { margin-bottom: 0.5rem; white-space: pre-line; }
  .tf { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .tf label { padding: 0.375rem 1rem; cursor: pointer; user-select: none; }
  .tf label + label { border-left: 1px solid var(--border); }
  .tf input { position: absolute; opacity: 0; pointer-events: none; }
  .tf input:checked + span { font-weight: 700; }
  .tf label:has(input:checked) { background: var(--accent); color: #fff; }
  .tf label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tf label:has(input:disabled) { cursor: default; }
  .result { margin-top: 0.5rem; padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.9375rem; }
  .result.ok { background: var(--ok-bg); border-left: 4px solid var(--ok); }
  .result.bad { background: var(--bad-bg); border-left: 4px solid var(--bad); }
  .result.na { background: var(--warn-bg); border-left: 4px solid var(--warn); }
  .result strong { display: block; }
  .result p { margin: 0.25rem 0 0; }
  .note { color: var(--warn); font-size: 0.875rem; margin-top: 0.25rem; }
  .key-header { font-size: 0.875rem; color: var(--muted); margin: 0.5rem 0 0; }
  .score { font-weight: 600; }
  ul.missed { padding-left: 1.25rem; }
  [hidden] { display: none !important; }
  @media (max-width: 30rem) { main { padding: 1rem 0.5rem 3rem; } .card { padding: 1rem; } }
</style>
</head>
<body>
<main>
  <h1>ML4T True/False Quiz</h1>
  <p class="muted" id="pool-info">Loading question bank…</p>

  <section class="card" id="setup" aria-labelledby="setup-h">
    <h2 id="setup-h">Start a quiz</h2>
    <fieldset>
      <legend>Mode</legend>
      <label class="opt"><input type="radio" name="mode" value="exam" checked> Exam simulation (<span id="exam-desc">20 ML + 20 QF</span>)</label><br>
      <label class="opt"><input type="radio" name="mode" value="all"> Entire pool, shuffled</label><br>
      <label class="opt"><input type="radio" name="mode" value="custom"> Custom</label>
    </fieldset>
    <fieldset id="custom-opts" disabled>
      <legend>Custom options</legend>
      <div class="row">
        <label>Category
          <select id="cat">
            <option value="both">ML + QF</option>
            <option value="ML">ML only</option>
            <option value="QF">QF (Trading) only</option>
          </select>
        </label>
        <label>Domain <select id="domain"><option value="all">All domains</option></select></label>
        <label>Questions <input type="number" id="count" min="1" value="10" style="width:5rem"></label>
      </div>
    </fieldset>
    <button class="primary" id="start">Start</button>
  </section>

  <section class="card" id="quiz" hidden aria-live="polite">
    <div class="meta">
      <span>Question <span id="pos"></span> · <span class="qid" id="qid"></span></span>
      <span class="score" id="running"></span>
    </div>
    <p class="muted" id="topic"></p>
    <div id="inverted" class="inverted" hidden></div>
    <div id="stem"></div>
    <form id="form"></form>
    <div class="row">
      <button class="primary" id="submit" type="button">Submit</button>
      <button id="next" type="button" hidden>Next question</button>
      <button id="finish" type="button">End quiz</button>
    </div>
  </section>

  <section class="card" id="summary" hidden>
    <h2>Results</h2>
    <div id="summary-body"></div>
    <button class="primary" id="restart">New quiz</button>
  </section>
</main>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
